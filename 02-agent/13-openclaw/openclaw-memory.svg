<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
  <defs>
    <style>
      .bg{fill:#f8faf8}.title{font:700 40px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#172033}.sub{font:400 20px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#5d6a75}.label{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#172033}.body{font:400 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#334155}.small{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#64748b}.card{fill:#fff;stroke:#d8e0d6;stroke-width:2}.file{fill:#ecfdf3;stroke:#83c69a}.index{fill:#eef6ff;stroke:#87b7ea}.tool{fill:#fff7e6;stroke:#dfb85f}.dream{fill:#f3edff;stroke:#a78bfa}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="1200" height="780"/>
  <text x="70" y="72" class="title">OpenClaw：文件为真，索引加速，插件可替换</text>
  <text x="70" y="110" class="sub">Markdown 是可信源，SQLite / FTS / embedding 负责召回，dreaming 负责长期巩固。</text>

  <rect x="70" y="165" width="275" height="130" rx="16" class="card file"/>
  <text x="95" y="207" class="label">MEMORY.md</text>
  <text x="95" y="244" class="body">长期稳定记忆</text>
  <text x="95" y="272" class="small">启动时进入上下文</text>

  <rect x="70" y="335" width="275" height="130" rx="16" class="card file"/>
  <text x="95" y="377" class="label">memory/*.md</text>
  <text x="95" y="414" class="body">日常工作记忆</text>
  <text x="95" y="442" class="small">会话摘要、观察、记录</text>

  <rect x="465" y="245" width="280" height="150" rx="16" class="card index"/>
  <text x="490" y="290" class="label">memory-core</text>
  <text x="490" y="327" class="body">SQLite + FTS + embeddings</text>
  <text x="490" y="357" class="small">关键词与语义混合检索</text>

  <path d="M345 230 C400 230 415 282 465 295" class="arrow"/>
  <path d="M345 400 C400 400 415 350 465 345" class="arrow"/>

  <rect x="845" y="150" width="280" height="120" rx="16" class="card tool"/>
  <text x="870" y="192" class="label">memory_search</text>
  <text x="870" y="228" class="body">按任务召回相关内容</text>

  <rect x="845" y="310" width="280" height="120" rx="16" class="card tool"/>
  <text x="870" y="352" class="label">memory_get</text>
  <text x="870" y="388" class="body">精确读取记忆文件</text>

  <path d="M745 305 C800 280 810 220 845 210" class="arrow"/>
  <path d="M745 345 C800 350 810 365 845 370" class="arrow"/>

  <rect x="465" y="555" width="280" height="125" rx="16" class="card dream"/>
  <text x="490" y="598" class="label">Dreaming</text>
  <text x="490" y="635" class="body">短期信号晋升长期记忆</text>
  <text x="490" y="663" class="small">DREAMS.md 可审阅</text>

  <rect x="845" y="555" width="280" height="125" rx="16" class="card"/>
  <text x="870" y="598" class="label">可替换后端</text>
  <text x="870" y="635" class="body">Builtin / QMD / Honcho / LanceDB</text>
  <text x="870" y="663" class="small">由 memory plugin slot 接入</text>

  <path d="M605 395 V555" class="arrow"/>
  <path d="M745 618 H845" class="arrow"/>
  <path d="M520 555 C395 520 305 480 210 465" class="arrow"/>

  <text x="70" y="748" class="sub">关键词：Markdown 可信源、混合检索、工具召回、后台巩固、后端插件化。</text>
</svg>
